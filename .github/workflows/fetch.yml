name: 更新销控数据

on:
  schedule:
    # 每小时整点运行（UTC 时间，即北京时间整点）
    - cron: '0 * * * *'
  workflow_dispatch:  # 允许手动触发

concurrency:
  group: fetch-data
  cancel-in-progress: false   # 上一次未跑完则等待，避免重叠抓取

permissions:
  contents: write  # 允许提交到仓库

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 差分快速抓取（仅对变动/缺失楼盘完整抓取，接口量从~1971降至~657+少量）
        run: python3 fetch_fast.py

      - name: 聚类统一板块（按"核心楼盘名+开发商"归并预售证，杜绝同一楼盘被拆到不同板块）
        run: python3 fix_grouping.py

      - name: 补抓空楼栋明细（fetch_fast 只抓 summary，每轮重建后 detail 可能为空；只对 buildings=[] 的盘补抓，耗时分摊）
        run: python3 refetch_all_empty_buildings.py

      - name: 提交并推送（抓取完整 + 文件有变化才提交）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sok=$(python3 -c "import json; print(json.load(open('fetch_status.json')).get('summary_ok', 0))")
          echo "summary_ok=$sok"
          # 抓取足够完整（>=500/657）才允许推送，避免网络抖动时推送降级数据
          if [ "$sok" -lt 500 ]; then
            echo "抓取不完整（summary_ok<$sok），跳过提交"
            exit 0
          fi
          # coord_overrides.json 是关键：fetch_fast.py 每轮重建都会按项目 id 重新套用其中的精确坐标，
          # 必须一并提交，否则每小时流水线 check-out 不到它，校正会被源数据冲掉。
          git add data.json fetch_status.json projects.json fix_grouping.py roster_overlay.json coord_overrides.json geocode_cache.json
          # 仅当文件确有变化才提交（fix_grouping 幂等：无变化则不产生 diff）
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "自动更新销控数据 + 聚类统一板块 $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
            echo "已推送变动数据"
          else
            echo "无变动，跳过提交"
          fi
