name: 更新销控数据

on:
  schedule:
    # 每小时整点运行（UTC 时间，即北京时间整点）
    - cron: '0 * * * *'
  workflow_dispatch:  # 允许手动触发

concurrency:
  group: fetch-data
  cancel-in-progress: false   # 上一次未跑完则等待，避免重叠抓取

permissions:
  contents: write  # 允许提交到仓库

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 差分快速抓取（仅对变动/缺失楼盘完整抓取，接口量从~1971降至~657+少量）
        run: python3 fetch_fast.py

      - name: 提交并推送（仅当数据变动且抓取完整）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          changed=$(python3 -c "import json; print(json.load(open('fetch_status.json')).get('changed', False))")
          sok=$(python3 -c "import json; print(json.load(open('fetch_status.json')).get('summary_ok', 0))")
          echo "changed=$changed summary_ok=$sok"
          # 双保险：有变动 + 摘要抓取足够完整（>=500/657），才推送，避免网络抖动时推送降级数据
          if [ "$changed" = "True" ] && [ "$sok" -ge 500 ]; then
            git add data.json fetch_status.json projects.json
            git commit -m "自动更新销控数据 $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
            echo "已推送变动数据"
          else
            echo "无变动或抓取不完整，跳过提交"
          fi
